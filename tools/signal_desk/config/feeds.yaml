# A small, legible daily source shelf. These feeds are collection leads, not a
# hierarchy of truth. Google News is used only where the publisher has no stable
# public feed; every item still retains its named publisher and original link.

feeds:
  - name: "Reuters Middle East"
    url: "https://news.google.com/rss/search?q=site%3Areuters.com%2Fworld%2Fmiddle-east%20%28Lebanon%20OR%20Beirut%20OR%20Hezbollah%29&hl=en&gl=LB&ceid=LB%3Aen"
    lang: "en"
    bias: "International wire; strong for attributed official reporting, cautious and institution-led"
    tier: 1

  - name: "L'Orient Today"
    url: "https://news.google.com/rss/search?q=site%3Atoday.lorientlejour.com%20%28Lebanon%20OR%20Beirut%20OR%20south%29&hl=en&gl=LB&ceid=LB%3Aen"
    lang: "en"
    bias: "Lebanese English-language newsroom; strong local detail, broadly critical of Hezbollah"
    tier: 1

  - name: "National News Agency Lebanon"
    url: "https://news.google.com/rss/search?q=site%3Anna-leb.gov.lb%20%28Lebanon%20OR%20cabinet%20OR%20army%20OR%20south%29&hl=en&gl=LB&ceid=LB%3Aen"
    lang: "en"
    bias: "Official Lebanese state record; useful for ministries and statements, not independent confirmation"
    tier: 1

  - name: "LBCI Lebanon"
    url: "https://news.google.com/rss/search?q=site%3Albcgroup.tv%20%28Lebanon%20OR%20Beirut%20OR%20Hezbollah%29&hl=en&gl=LB&ceid=LB%3Aen"
    lang: "en"
    bias: "Lebanese broadcaster; useful for fast local political and security reporting"
    tier: 2

  - name: "Lebanese Army"
    url: "https://news.google.com/rss/search?q=site%3Alebarmy.gov.lb%20%28%D8%A7%D9%84%D8%AC%D9%8A%D8%B4%20OR%20%D8%A7%D9%84%D8%AC%D9%86%D9%88%D8%A8%20OR%20%D8%A7%D9%84%D8%AD%D8%AF%D9%88%D8%AF%29&hl=ar&gl=LB&ceid=LB%3Aar"
    lang: "ar"
    bias: "Official Lebanese Army record; primary institutional claims, not independent confirmation"
    tier: 1

  - name: "UNIFIL"
    url: "https://news.google.com/rss/search?q=site%3Aunifil.unmissions.org%20%28Lebanon%20OR%20Blue%20Line%20OR%20peacekeepers%29&hl=en&gl=LB&ceid=LB%3Aen"
    lang: "en"
    bias: "Official UN peacekeeping mission record for the Blue Line and Resolution 1701"
    tier: 1

  - name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    lang: "en"
    bias: "Qatari state-funded regional network; useful for regional reporting and Arab political framing"
    tier: 1

  - name: "Al Mayadeen"
    url: "https://news.google.com/rss/search?q=site%3Aalmayadeen.net%20%28%D9%84%D8%A8%D9%86%D8%A7%D9%86%20OR%20%D8%A7%D9%84%D8%AC%D9%86%D9%88%D8%A8%20OR%20%D8%AD%D8%B2%D8%A8%20%D8%A7%D9%84%D9%84%D9%87%29&hl=ar&gl=LB&ceid=LB%3Aar"
    lang: "ar"
    bias: "Beirut-based, resistance-aligned outlet; primary narrative stream, not independent confirmation"
    tier: 1

  - name: "The Times of Israel"
    url: "https://www.timesofisrael.com/feed/"
    lang: "en"
    bias: "Israeli mainstream outlet; useful for official and security-facing Israeli claims"
    tier: 1

  - name: "Haaretz"
    url: "https://news.google.com/rss/search?q=site%3Ahaaretz.com%20%28Lebanon%20OR%20Hezbollah%20OR%20Beirut%29&hl=en&gl=LB&ceid=LB%3Aen"
    lang: "en"
    bias: "Israeli liberal paper; useful for reporting that can challenge Israeli official claims"
    tier: 1

  - name: "+972 Magazine"
    url: "https://news.google.com/rss/search?q=site%3A972mag.com%20%28Lebanon%20OR%20Israel%20OR%20Palestine%29&hl=en&gl=LB&ceid=LB%3Aen"
    lang: "en"
    bias: "Israeli-Palestinian anti-occupation magazine; useful for dissenting reporting and rights analysis"
    tier: 1

  - name: "ReliefWeb Lebanon"
    url: "https://news.google.com/rss/search?q=site%3Areliefweb.int%20Lebanon&hl=en&gl=LB&ceid=LB%3Aen"
    lang: "en"
    bias: "UN-curated humanitarian reporting from named partner organisations"
    tier: 1
